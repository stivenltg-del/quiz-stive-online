<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quiz Stive</title>
<style>
:root{
  --bg:#f6f7fb;
  --card:#ffffff;
  --dark:#202737;
  --coral:#f27679;
  --pink:#fff0f0;
  --muted:#aeb2bd;
  --shadow:0 12px 30px rgba(32,39,55,.06);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--dark)}
body{padding:22px 20px 34px}
.app{max-width:900px;margin:auto}
.topbar{
  height:82px;display:flex;align-items:center;justify-content:space-between;
  padding:0 2px 12px;
}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:21px;letter-spacing:.2px}
.brand-dot{width:38px;height:38px;border-radius:50%;background:#ffe4e5;display:grid;place-items:center}
.brand-dot:after{content:"";width:21px;height:21px;border-radius:50%;background:#f46e73}
.settings{
  width:70px;height:52px;border-radius:28px;border:1px solid #e6e7ec;background:white;
  box-shadow:0 2px 8px rgba(0,0,0,.03);display:grid;place-items:center;cursor:pointer
}
.sliders{width:28px;height:23px;position:relative}
.sliders span,.sliders:before,.sliders:after{content:"";position:absolute;left:0;right:0;height:2px;background:#202737;border-radius:3px}
.sliders:before{top:3px}.sliders span{top:11px}.sliders:after{top:19px}
.sliders i{position:absolute;width:6px;height:6px;background:#202737;border-radius:50%}
.sliders i:nth-child(1){top:1px;left:8px}.sliders i:nth-child(2){top:9px;left:17px}.sliders i:nth-child(3){top:17px;left:6px}

.card{
  position:relative;overflow:hidden;background:var(--card);min-height:calc(100vh - 150px);
  border-radius:34px;box-shadow:var(--shadow);padding:78px 9% 70px;
}
.blob{
  position:absolute;width:53%;height:400px;right:-6%;top:-145px;background:var(--pink);
  border-radius:0 0 0 100%;
  transform:rotate(-5deg);z-index:0;
}
.content{position:relative;z-index:1;max-width:680px}
.eyebrow{color:var(--coral);font-size:22px;font-weight:800;letter-spacing:3px;margin-top:255px;margin-bottom:32px}
.hero-title{font-size:24px;line-height:1.35;font-weight:500;margin:0 0 38px;text-transform:uppercase}
.subtitle{font-size:23px;color:#a9adb8;margin:0 0 42px}
.primary{
  display:inline-flex;align-items:center;gap:28px;border:0;background:var(--dark);color:white;
  border-radius:25px;padding:22px 28px 22px 34px;font-size:18px;font-weight:800;cursor:pointer;
  box-shadow:0 12px 22px rgba(32,39,55,.13)
}
.arrow{font-size:34px;font-weight:300;line-height:0}
.hidden{display:none!important}

.quiz-head{margin-top:55px}
.progress{font-size:14px;color:#a5a9b3;letter-spacing:1px;margin-bottom:14px}
.livesbar{display:flex;align-items:center;gap:8px;margin:0 0 16px;font-weight:900}
.heart{font-size:24px;transition:.15s}
.points-pop{margin:14px 0 0;padding:12px 15px;border-radius:14px;background:#fff7f7;border:1px solid #ffd4d6;font-weight:900;color:#d95d62}
.retry-box{margin-top:20px;padding:18px;border-radius:18px;background:#fff7f7;border:1px solid #ffd4d6}

.question{font-size:29px;line-height:1.25;margin:0 0 30px}
.options{display:grid;gap:14px}
.option{
  border:1px solid #ececf1;background:#fff;border-radius:20px;padding:14px;display:flex;gap:15px;
  align-items:center;text-align:left;cursor:pointer;transition:.18s
}
.option:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.05)}
.option.selected{border:2px solid var(--coral);background:#fff7f7}
.option img{width:76px;height:76px;border-radius:14px;object-fit:cover;background:#f0f1f5}
.option b{font-size:17px}.option small{display:block;color:#9da2ae;margin-top:5px}
.check{margin-top:24px;width:100%;justify-content:center}

.feedback{margin-top:28px;padding:22px;border-radius:24px;background:#fafafb;border:1px solid #eee}
.feedback img{width:100%;max-height:260px;object-fit:cover;border-radius:18px;margin-top:14px}
.feedback h2{margin:0 0 7px;font-size:25px}.feedback p{color:#656b78;line-height:1.55}
.video-modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9999;display:none;align-items:center;justify-content:center;padding:18px}
.video-modal.open{display:flex}.video-card{width:min(920px,100%);background:#fff;border-radius:24px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.video-card video{display:block;width:100%;max-height:78vh;background:#000;border-radius:16px}.video-head{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 10px;font-weight:900}.video-close{border:0;background:#f0f1f5;border-radius:12px;padding:9px 13px;font-weight:800;cursor:pointer}
.next{margin-top:16px}

.final{text-align:center;padding-top:180px}
.final .score{font-size:64px;font-weight:900;color:var(--coral);margin:10px 0}
.final h1{font-size:34px}

.editor{padding-top:10px}
.editor h1{font-size:30px;margin:0 0 8px}
.editor-note{color:#858b98;line-height:1.5;margin-bottom:25px}
.qbox{border:1px solid #ececf1;border-radius:22px;padding:18px;margin:14px 0;background:#fff}
label{display:block;font-size:13px;font-weight:700;color:#747987;margin:10px 0 6px}
input,textarea,select{
 width:100%;border:1px solid #e4e5eb;border-radius:12px;padding:12px;font:inherit;outline:none;background:#fff
}
textarea{min-height:75px;resize:vertical}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.editor-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.secondary{background:#fff;color:var(--dark);border:1px solid #dedfe5;box-shadow:none}
@media(max-width:600px){
 body{padding:12px 12px 25px}.topbar{height:78px}.brand{font-size:19px}.settings{width:62px}
 .card{min-height:calc(100vh - 110px);border-radius:30px;padding:60px 28px}
 .blob{height:310px;width:72%;right:-17%;top:-100px}
 .eyebrow{font-size:17px;letter-spacing:2.5px;margin-top:255px;margin-bottom:28px}
 .hero-title{font-size:20px}.subtitle{font-size:19px}
 .primary{font-size:16px;padding:19px 22px 19px 25px}
 .question{font-size:25px}.optgrid{grid-template-columns:1fr}
}

.image-pick{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px
}
.image-pick input[type=file]{padding:8px;background:#fff}
.image-preview{
  width:90px;height:65px;border-radius:12px;object-fit:cover;background:#f0f1f5;
  border:1px solid #e4e5eb
}
.image-help{font-size:12px;color:#9297a3;margin-top:5px}


/* FINAL POLISH */
.option{
  width:100%;
  min-height:110px;
}
.option img{
  flex:0 0 96px;
  width:96px;
  height:96px;
  aspect-ratio:1/1;
  object-fit:cover;
  object-position:center;
  display:block;
}
.feedback img{
  width:100%;
  aspect-ratio:16/9;
  max-height:none;
  object-fit:cover;
  object-position:center;
  display:block;
}
@media(max-width:600px){
  .option{min-height:104px;padding:10px;gap:12px}
  .option img{flex-basis:86px;width:86px;height:86px}
}


.meme-check{
  padding:0!important;
  border:0!important;
  overflow:hidden;
  background:#fff!important;
  width:100%;
  min-height:150px;
  border-radius:24px;
  cursor:pointer;
}
.meme-check img{
  display:block;
  width:100%;
  height:100%;
  min-height:150px;
  max-height:360px;
  object-fit:cover;
  object-position:center;
}
.meme-check:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 24px rgba(0,0,0,.10);
}
@media(max-width:600px){
  .meme-check{min-height:130px;border-radius:20px}
  .meme-check img{min-height:130px}
}

</style>
<style>.check-wrap{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px}.check-label{font-weight:800;font-size:16px}.meme-check{width:78px;height:78px;padding:0!important;border:3px solid #fff!important;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 5px 14px rgba(0,0,0,.12);cursor:pointer}.meme-check img{width:100%;height:100%;object-fit:contain;display:block}.meme-check:active{transform:scale(.95)}@media(max-width:600px){.check-label{font-size:14px}.meme-check{width:68px;height:68px}}</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
.name-modal{position:fixed;inset:0;background:rgba(20,25,38,.45);display:grid;place-items:center;padding:20px;z-index:50}.name-box{width:min(420px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.2);text-align:center}.name-box h2{margin:0 0 8px}.name-box p{color:#8d93a0;margin:0 0 18px}.name-box input{width:100%;padding:14px 16px;border:1px solid #dddfe7;border-radius:14px;font-size:16px;outline:none}.name-box button{margin-top:12px;width:100%;justify-content:center}.name-error{color:#d9534f;font-size:13px;min-height:18px;margin-top:8px}.submit-status{font-size:13px;color:#777;margin-top:10px}.name-box.hidden{display:none!important}
</style>
</head>
<body>
<div id="nameModal" class="name-modal hidden">
  <div class="name-box">
    <h2>ISI NAMA DULU 👤</h2>
    <p>Cuma nama. Tidak perlu login, email, atau kode.</p>
    <input id="participantName" maxlength="60" autocomplete="name" placeholder="Nama kamu">
    <div id="nameError" class="name-error"></div>
    <button class="primary" onclick="confirmName()">JOM <span class="arrow">→</span></button>
  </div>
</div>

<script>const defaultQuiz = {
  eyebrow:"QUIZ PERSONAL GW",
  title:"SEBERAPA KENAL KAMU SAMA STIVEN?",
  subtitle:"[EDIT SUBJUDUL QUIZ]",
  display:{eyebrow:{},title:{},subtitle:{},question:{}},
  resultRanges:[
    {label:"Level 1",message:"Masih kurang kenal 😭",reactionImage:""},
    {label:"Level 2",message:"Lumayan kenal 👀",reactionImage:""},
    {label:"Level 3",message:"Cukup dekat 😎",reactionImage:""},
    {label:"Level 4",message:"Kenal banget 🔥",reactionImage:""},
    {label:"Level 5",message:"Bestie banget 💀",reactionImage:""}
  ],
  questions:Array.from({length:10},(_,qi)=>({
    order:qi+1,
    question:`Pertanyaan ${qi+1}: Seberapa kenal kamu sama Stiven?`,
    options:["Jawaban A","Jawaban B","Jawaban C","Jawaban D","Jawaban E"].map((x,i)=>({
      text:x,image:`https://placehold.co/600x400/F2F3F7/202737?text=Pilihan+${String.fromCharCode(65+i)}`,
      points:[5,3,2,1,0][i],
      feedback:["NAH INI BARU BENER 💀","lumayan ngerti","hampir kena","kok bisa 😭","BRO SIAPA KAMU"][i],
      explanation:"Keterangan jawaban bisa kamu edit sendiri.",reactionImage:""
    }))
  }))
};

let quiz=defaultQuiz;
const MAX_LIVES=3;
let current=0,score=0,selected=null,checked=false,participantName="",quizStartedAt=0,resultSent=false;
let randomizedOptions=[],participantLives=MAX_LIVES;

function show(id){["home","quiz","final"].forEach(x=>document.getElementById(x).classList.add("hidden"));document.getElementById(id).classList.remove("hidden")}
function resetLives(){participantLives=MAX_LIVES;renderLives()}
function renderLives(){const el=document.getElementById("livesBar");if(el)el.innerHTML=`Darah: ${Array.from({length:MAX_LIVES},(_,i)=>`<span class="heart">${i<participantLives?"❤️":"🖤"}</span>`).join("")}`}
function showPoints(points){const el=document.getElementById("pointsPop");if(!el)return;el.textContent=points>0?`+${points} poin 🎉`:"0 poin • -1 ❤️";el.classList.remove("hidden");}
function hidePoints(){document.getElementById("pointsPop")?.classList.add("hidden")}
function startFreshQuiz(){current=0;score=0;selected=null;checked=false;resultSent=false;resetLives();quizStartedAt=Date.now();show("quiz");renderQuestion()}
function startQuiz(){
  if(!participantName){document.getElementById("nameModal").classList.remove("hidden");setTimeout(()=>document.getElementById("participantName").focus(),50);return}
  startFreshQuiz();
}
function confirmName(){
  const input=document.getElementById("participantName"),name=input.value.trim().replace(/\s+/g," "),err=document.getElementById("nameError");
  if(name.length<2){err.textContent="Nama minimal 2 karakter.";return}
  participantName=name;
  try{
    startFreshQuiz();
    err.textContent="";
    document.getElementById("nameModal").classList.add("hidden");
  }catch(e){
    console.error("Gagal memulai quiz:",e);
    participantName="";
    err.textContent="Quiz gagal dimulai. Coba refresh halaman.";
  }
}
function calcRangeBounds(max){
  max=Math.max(0,Math.round(Number(max)||0));
  if(max<=0)return Array.from({length:5},()=>({min:0,max:0}));
  return [1,2,3,4,5].map(n=>({min:Math.floor(((n-1)*max)/5)+1,max:Math.floor((n*max)/5)}));
}
function resultFromScore(sc,max,ranges){
  const rs=Array.isArray(ranges)&&ranges.length===5?ranges:defaultQuiz.resultRanges,b=calcRangeBounds(max),s=Math.max(0,Number(sc)||0);
  let i=b.findIndex(x=>s>=x.min&&s<=x.max);if(i<0)i=s>=b[4].min?4:0;
  return {range:rs[i],bounds:b[i],index:i};
}
function shuffleCopy(arr){
  const a=Array.isArray(arr)?arr.slice():[];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function renderQuestion(){
  const q=quiz.questions[current];
  randomizedOptions=shuffleCopy(Array.isArray(q.options)?q.options:[]);
  document.getElementById("progress").textContent=`PERTANYAAN ${current+1} / ${quiz.questions.length}`;
  document.getElementById("question").textContent=q.question||"";
  applyDisplayStyles(quiz.display||{});hidePoints();renderLives();
  document.getElementById("feedback").classList.add("hidden");document.getElementById("nextBtn").classList.add("hidden");document.getElementById("checkBtn").classList.remove("hidden");
  selected=null;checked=false;
  document.getElementById("options").innerHTML=randomizedOptions.map((o,i)=>`<button class="option" onclick="selectOption(${i})"><img src="${escapeAttr(o.image||"")}" onerror="this.style.display='none'"><span><b>${String.fromCharCode(65+i)}. ${escapeHTML(o.text||"")}</b></span></button>`).join("");
}
function selectOption(i){
  if(checked)return;
  selected=i;
  document.querySelectorAll(".option").forEach((el,n)=>el.classList.toggle("selected",n===i));
  const o=randomizedOptions[i]||{};
  if(o.videoEnabled && o.videoUrl) openSpecialVideo(o.videoUrl);
}
function ensureVideoModal(){
  let m=document.getElementById('videoModal');
  if(m)return m;
  m=document.createElement('div');m.id='videoModal';m.setAttribute('aria-hidden','true');
  m.style.cssText='position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72);box-sizing:border-box';
  m.innerHTML=`<div style="position:relative;width:min(92vw,520px);max-height:92vh;background:#111;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)"><button id="videoClose" aria-label="Tutup" style="position:absolute;right:10px;top:10px;z-index:3;width:40px;height:40px;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:24px;cursor:pointer">×</button><div id="videoStage" style="width:100%;aspect-ratio:9/16;background:#000;display:flex;align-items:center;justify-content:center"></div><div id="videoHint" style="padding:10px 14px;color:#fff;font-size:13px;background:#111"></div></div>`;
  document.body.appendChild(m);
  document.getElementById('videoClose').addEventListener('click',closeSpecialVideo);
  m.addEventListener('click',e=>{if(e.target===m)closeSpecialVideo()});
  return m;
}
function getTikTokId(url){
  try{
    const u=new URL(url);
    const m=u.pathname.match(/\/video\/(\d+)/)||u.pathname.match(/\/player\/v1\/(\d+)/);
    return m?m[1]:null;
  }catch(e){return null}
}
function closeSpecialVideo(){
  const m=document.getElementById('videoModal'),stage=document.getElementById('videoStage');
  if(stage)stage.innerHTML='';
  if(m){m.style.display='none';m.setAttribute('aria-hidden','true')}
}
function openSpecialVideo(url){
  if(!url)return;
  const m=ensureVideoModal(),stage=document.getElementById('videoStage'),h=document.getElementById('videoHint');
  const clean=String(url).trim(),tid=getTikTokId(clean);
  stage.innerHTML='';
  if(tid){
    const iframe=document.createElement('iframe');
    iframe.src=`https://www.tiktok.com/player/v1/${tid}?controls=1&description=1&music_info=1&loop=1`;
    iframe.style.cssText='width:100%;height:100%;border:0;display:block';
    iframe.setAttribute('allow','fullscreen; autoplay');
    iframe.setAttribute('allowfullscreen','');
    iframe.title='TikTok video';
    stage.appendChild(iframe);
    h.textContent='TikTok siap diputar. Jika belum otomatis, tekan ▶. Suara tersedia dari kontrol TikTok.';
  }else{
    const v=document.createElement('video');
    v.id='specialVideo';v.controls=true;v.playsInline=true;v.preload='metadata';v.style.cssText='width:100%;height:100%;object-fit:contain;display:block';
    v.src=clean;v.volume=1;stage.appendChild(v);
    h.textContent='Video langsung. Tekan ▶ jika belum otomatis.';
    const p=v.play();if(p&&typeof p.catch==='function')p.catch(()=>{});
  }
  m.style.display='flex';m.setAttribute('aria-hidden','false');
}

function checkAnswer(){
  if(selected===null||checked)return;
  checked=true;
  const o=randomizedOptions[selected]||{};
  const pts=Math.max(0,Number(o.points)||0);
  score+=pts;showPoints(pts);if(typeof playCustomSound==="function")playCustomSound(pts);
  if(pts===0)participantLives=Math.max(0,participantLives-1);
  renderLives();
  document.getElementById("checkBtn").classList.add("hidden");
  const f=document.getElementById("feedback");
  const reaction=o.reactionImage?`<img src="${escapeAttr(o.reactionImage)}" onerror="this.style.display='none'">`:"";
  f.innerHTML=`<h2>${escapeHTML(o.feedback||"")}</h2><p>${escapeHTML(o.explanation||"")}</p>${reaction}`;f.classList.remove("hidden");
  if(participantLives<=0){
    f.innerHTML=`<h2>💔 Darah habis!</h2><p>Quiz akan dimulai ulang dari awal.</p>`;
    document.getElementById("nextBtn").classList.add("hidden");
    setTimeout(()=>startFreshQuiz(),1100);return;
  }
  const next=document.getElementById("nextBtn");next.classList.remove("hidden");next.innerHTML=current===quiz.questions.length-1?'LIHAT HASIL <span class="arrow">→</span>':'LANJOT <span class="arrow">→</span>';
}
function nextQuestion(){
  if(current<quiz.questions.length-1){current++;renderQuestion();return}
  const maxScore=quiz.questions.reduce((sum,q)=>sum+Math.max(0,...(q.options||[]).map(o=>Number(o.points)||0)),0);
  const r=resultFromScore(score,maxScore,quiz.resultRanges);
  document.getElementById("finalScore").textContent=`${score} / ${maxScore}`;
  document.getElementById("finalText").textContent=r.range?.message||"Selesai!";
  const oldImg=document.querySelector("#final .result-reaction");if(oldImg)oldImg.remove();
  if(r.range?.reactionImage){const img=document.createElement("img");img.className="result-reaction";img.src=r.range.reactionImage;img.style.cssText="display:block;width:min(100%,420px);aspect-ratio:1/1;object-fit:cover;border-radius:20px;margin:20px auto";document.getElementById("finalText").after(img)}
  show("final");saveResult();
}
async function saveResult(){
  if(resultSent||!window.FIREBASE_CONFIG||window.FIREBASE_CONFIG.apiKey==="ISI_API_KEY")return;
  try{
    if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
    const db=firebase.firestore(),maxScore=quiz.questions.reduce((sum,q)=>sum+Math.max(0,...(q.options||[]).map(o=>Number(o.points)||0)),0);
    await db.collection("quizResults").add({name:participantName,score:Number(score)||0,maxScore,questionCount:quiz.questions.length,durationSeconds:Math.max(0,Math.round((Date.now()-quizStartedAt)/1000)),createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    resultSent=true;
  }catch(e){console.error("Gagal mengirim hasil:",e)}
}
function escapeHTML(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function escapeAttr(s){return escapeHTML(s)}
function applyDisplayStyles(d){
  d=d||{};const map={eyebrow:"#eyebrow",title:"#heroTitle",subtitle:"#heroSubtitle",question:"#question"};
  Object.keys(map).forEach(k=>{const el=document.querySelector(map[k]),st=d[k]||{};if(!el)return;if(st.align)el.style.textAlign=st.align;if(st.size)el.style.fontSize=st.size+"px";if(st.weight)el.style.fontWeight=st.weight;if(st.color)el.style.color=st.color;if(st.letter!==undefined)el.style.letterSpacing=st.letter+"px";if(st.marginTop!==undefined)el.style.marginTop=st.marginTop+"px";if(st.marginBottom!==undefined)el.style.marginBottom=st.marginBottom+"px";if(st.maxWidth)el.style.maxWidth=st.maxWidth+"px"});
}
async function loadQuizFromFirebase(){
  if(!window.FIREBASE_CONFIG||window.FIREBASE_CONFIG.apiKey==="ISI_API_KEY")return;
  try{
    if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
    const db=firebase.firestore(),metaSnap=await db.collection("quizSettings").doc("main").get(),qs=await db.collection("quizQuestions").orderBy("order").get();
    if(!metaSnap.exists||qs.empty)return;
    const meta=metaSnap.data()||{},questions=qs.docs.map(d=>d.data()).sort((a,b)=>(a.order||0)-(b.order||0));
    if(questions.length){quiz={eyebrow:meta.eyebrow||defaultQuiz.eyebrow,title:meta.title||defaultQuiz.title,subtitle:meta.subtitle||defaultQuiz.subtitle,display:meta.display||defaultQuiz.display,resultRanges:Array.isArray(meta.resultRanges)&&meta.resultRanges.length===5?meta.resultRanges:defaultQuiz.resultRanges,questions};document.getElementById("eyebrow").textContent=quiz.eyebrow;document.getElementById("heroTitle").textContent=quiz.title;document.getElementById("heroSubtitle").textContent=quiz.subtitle;applyDisplayStyles(quiz.display)}
  }catch(e){console.warn("Quiz online belum tersedia, memakai quiz bawaan.",e)}
}
document.getElementById("eyebrow").textContent=quiz.eyebrow;document.getElementById("heroTitle").textContent=quiz.title;document.getElementById("heroSubtitle").textContent=quiz.subtitle;renderLives();loadQuizFromFirebase();
</script>

<!-- Custom sound system -->
<style>
.sound-toggle{border:1px solid #e6e7ec;background:#fff;border-radius:18px;padding:10px 14px;font-weight:700;cursor:pointer;color:#202737}.sound-toggle.off{opacity:.55}
</style>
<script>
let soundEnabled=localStorage.getItem('quizSoundEnabled')!=='0';
const customSounds={button:'',0:'',1:'',2:'',3:'',4:'',5:''};
function updateSoundButton(){const b=document.getElementById('soundToggle');if(!b)return;b.textContent=soundEnabled?'🔊 Suara ON':'🔇 Suara OFF';b.classList.toggle('off',!soundEnabled);}
function toggleSound(){soundEnabled=!soundEnabled;localStorage.setItem('quizSoundEnabled',soundEnabled?'1':'0');updateSoundButton();if(soundEnabled)playCustomSound('button');}
function playCustomSound(key){if(!soundEnabled)return;const src=customSounds[String(key)];if(!src)return;try{const a=new Audio(src);a.volume=.9;a.play().catch(()=>{});}catch(e){}}
async function loadCustomSounds(){
  try{if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);const db=firebase.firestore();
    for(const k of Object.keys(customSounds)){const snap=await db.collection('quizSounds').doc(String(k)).get();if(snap.exists&&typeof snap.data().data==='string')customSounds[k]=snap.data().data;}
  }catch(e){console.warn('Suara custom belum tersedia.',e);}
}
function installSoundUI(){const top=document.querySelector('.topbar');if(top&&!document.getElementById('soundToggle')){const b=document.createElement('button');b.id='soundToggle';b.className='sound-toggle';b.type='button';b.onclick=toggleSound;top.appendChild(b);}updateSoundButton();}
const _startQuiz=startQuiz;startQuiz=function(){playCustomSound('button');return _startQuiz.apply(this,arguments)};
const _selectOption=selectOption;selectOption=function(i){playCustomSound('button');return _selectOption.apply(this,arguments)};
const _checkAnswer=checkAnswer;checkAnswer=function(){return _checkAnswer.apply(this,arguments)};
const _nextQuestion=nextQuestion;nextQuestion=function(){playCustomSound('button');return _nextQuestion.apply(this,arguments)};
window.addEventListener('load',()=>{installSoundUI();loadCustomSounds();});
</script>
</body>
