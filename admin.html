<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Quiz Stive</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,Arial;background:#f4f6fb;color:#202737;margin:0;padding:16px}
.wrap{max-width:1100px;margin:auto;background:#fff;padding:20px;border-radius:22px;box-shadow:0 10px 35px #18233b12}
h1,h2{margin-top:0}
input,textarea,select,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #d8dce5}
input,textarea,select{width:100%;background:#fff}
textarea{min-height:70px;resize:vertical}
button{background:#202737;color:#fff;cursor:pointer}
button.secondary{background:#fff;color:#202737}
button.danger{background:#c93b4b}
.hidden{display:none!important}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tab{background:#fff;color:#202737;border:1px solid #ddd}
.tab.active{background:#202737;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border:1px solid #e7e8ed;border-radius:18px;padding:16px;margin:14px 0;background:#fff}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.option{border:1px solid #eee;border-radius:14px;padding:12px;margin:12px 0;background:#fafbfc}
.image-row{display:grid;grid-template-columns:1fr 100px;gap:10px;align-items:end}
.preview{width:100px;height:75px;border-radius:10px;object-fit:cover;border:1px solid #ddd;background:#f1f2f5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.status{padding:10px;border-radius:10px;background:#f4f6fb;margin:10px 0}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;white-space:nowrap}
.scroll{overflow:auto}
small{color:#69707e}
@media(max-width:700px){.grid{grid-template-columns:1fr}.image-row{grid-template-columns:1fr 80px}.preview{width:80px;height:60px}}
</style>
</head>
<body>
<main class="wrap">
<h1>👑 Admin Quiz Stive</h1>
<p><small>Admin bisa mengedit isi quiz dan melihat hasil peserta. Peserta tetap memakai <b>index.html</b>.</small></p>

<section id="login">
  <div class="grid">
    <div><label>Email admin</label><input id="email" type="email" placeholder="Email admin"></div>
    <div><label>Password</label><input id="password" type="password" placeholder="Password"></div>
  </div>
  <div class="actions"><button id="loginBtn">Login</button></div>
  <div id="msg" class="status"></div>
</section>

<section id="panel" class="hidden">
  <div id="who" class="status"></div>
  <div class="tabs">
    <button class="tab active" data-tab="editor">✏️ Edit Quiz</button>
    <button class="tab" data-tab="results">📊 Hasil</button>
    <button id="logout" class="tab">Logout</button>
  </div>

  <section id="editorTab">
    <div class="card">
      <h2>Identitas Quiz</h2>
      <div class="grid">
        <div><label>Teks kecil atas</label><input id="eyebrow"></div>
        <div><label>Judul</label><input id="title"></div>
      </div>
      <label>Subjudul</label><textarea id="subtitle"></textarea>
    </div>
    <div id="questions"></div>
    <div class="actions">
      <button id="saveQuiz">💾 Simpan Quiz</button>
      <button id="reloadQuiz" class="secondary">↻ Muat ulang</button>
    </div>
    <div id="saveStatus" class="status"></div>
  </section>

  <section id="resultsTab" class="hidden">
    <div class="actions">
      <button id="refresh">Muat ulang hasil</button>
      <button id="export">Ekspor CSV</button>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>Nama</th><th>Skor</th><th>Jumlah soal</th><th>Durasi</th><th>Waktu kirim</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</section>
</main>

<script>
window.FIREBASE_CONFIG = {
  apiKey: "AIzaSyA_PEESWAuScYrU8Rd9uPS24UKvj5glT5I",
  authDomain: "seberapa-kenal-sih.firebaseapp.com",
  projectId: "seberapa-kenal-sih",
  storageBucket: "seberapa-kenal-sih.firebasestorage.app",
  messagingSenderId: "368960033210",
  appId: "1:368960033210:web:fea06298c84a7df80d4d83",
  measurementId: "G-0PV2V8TQW6"
};
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
let auth=null,db=null,cache=[],quizData=null;
const $=id=>document.getElementById(id);
function setMsg(t){$("msg").textContent=t||""}
function setSave(t){$("saveStatus").textContent=t||""}

function defaultData(){
  return {
    eyebrow:"QUIZ PERSONAL GW",
    title:"SEBERAPA KENAL KAMU SAMA STIVEN?",
    subtitle:"[EDIT SUBJUDUL QUIZ]",
    questions:Array.from({length:10},(_,qi)=>({
      question:`Pertanyaan ${qi+1}: Seberapa kenal kamu sama Stiven?`,
      options:["Jawaban A","Jawaban B","Jawaban C","Jawaban D","Jawaban E"].map((text,i)=>({
        text,image:`https://placehold.co/600x400/F2F3F7/202737?text=Pilihan+${String.fromCharCode(65+i)}`,
        points:[5,3,2,1,0][i],
        feedback:["NAH INI BARU BENER 💀","lumayan ngerti","hampir kena","kok bisa 😭","BRO SIAPA KAMU"][i],
        explanation:"Keterangan jawaban bisa kamu edit sendiri.",
        reactionImage:`https://placehold.co/800x450/FFF0F0/F27679?text=Reaction+${String.fromCharCode(65+i)}`
      }))
    }))
  };
}

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function renderEditor(data){
  quizData=data;
  $("eyebrow").value=data.eyebrow||"";
  $("title").value=data.title||"";
  $("subtitle").value=data.subtitle||"";
  $("questions").innerHTML="";
  data.questions.forEach((q,qi)=>{
    const box=document.createElement("div");
    box.className="card";
    box.innerHTML=`<div class="qhead"><h2>Soal ${qi+1}</h2><small>Urutan ${qi+1}</small></div>
      <label>Pertanyaan</label><textarea class="q-text">${esc(q.question)}</textarea>
      <div class="options"></div>`;
    const opts=box.querySelector(".options");
    (q.options||[]).forEach((o,oi)=>{
      const op=document.createElement("div");
      op.className="option";
      op.innerHTML=`<b>Pilihan ${String.fromCharCode(65+oi)}</b>
        <label>Teks pilihan</label><input class="o-text" value="${esc(o.text)}">
        <div class="image-row">
          <div>
            <label>Gambar pilihan</label>
            <input class="o-file" type="file" accept="image/*">
            <input class="o-image" value="${esc(o.image||"")}" placeholder="URL gambar (opsional)">
            <small>Pilih file dari galeri atau gunakan URL.</small>
          </div>
          <img class="preview" src="${esc(o.image||"")}" onerror="this.style.opacity=.35">
        </div>
        <div class="grid">
          <div><label>Poin</label><input class="o-points" type="number" value="${Number(o.points)||0}"></div>
          <div><label>Feedback</label><input class="o-feedback" value="${esc(o.feedback||"")}"></div>
        </div>
        <label>Keterangan / penjelasan</label><textarea class="o-explanation">${esc(o.explanation||"")}</textarea>
        <div class="image-row">
          <div>
            <label>Gambar reaction setelah memilih</label>
            <input class="r-file" type="file" accept="image/*">
            <input class="o-reaction" value="${esc(o.reactionImage||"")}" placeholder="URL reaction (opsional)">
            <small>Gambar ini muncul setelah peserta menekan Cek Jawa.</small>
          </div>
          <img class="preview r-preview" src="${esc(o.reactionImage||"")}" onerror="this.style.opacity=.35">
        </div>`;
      const file=op.querySelector(".o-file"), img=op.querySelector(".o-image"), prev=op.querySelector(".preview");
      const rfile=op.querySelector(".r-file"), rimg=op.querySelector(".o-reaction"), rprev=op.querySelector(".r-preview");
      file.onchange=async()=>{if(file.files[0]){const data=await compressImage(file.files[0]);img.value=data;prev.src=data;prev.style.opacity=1;}};
      rfile.onchange=async()=>{if(rfile.files[0]){const data=await compressImage(rfile.files[0],1000,0.72);rimg.value=data;rprev.src=data;rprev.style.opacity=1;}};
      img.oninput=()=>{prev.src=img.value;prev.style.opacity=1};
      rimg.oninput=()=>{rprev.src=rimg.value;rprev.style.opacity=1};
      opts.appendChild(op);
    });
    $("questions").appendChild(box);
  });
}

async function compressImage(file,maxSide=700,quality=.72){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        let w=im.width,h=im.height,scale=Math.min(1,maxSide/Math.max(w,h));
        w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
        const c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(im,0,0,w,h);
        resolve(c.toDataURL("image/jpeg",quality));
      };
      im.onerror=reject;im.src=fr.result;
    };
    fr.onerror=reject;fr.readAsDataURL(file);
  });
}

function collectEditor(){
  const questions=[...document.querySelectorAll("#questions>.card")].map((box,qi)=>({
    order:qi+1,
    question:box.querySelector(".q-text").value.trim(),
    options:[...box.querySelectorAll(".option")].map(op=>({
      text:op.querySelector(".o-text").value.trim(),
      image:op.querySelector(".o-image").value.trim(),
      points:Number(op.querySelector(".o-points").value)||0,
      feedback:op.querySelector(".o-feedback").value.trim(),
      explanation:op.querySelector(".o-explanation").value.trim(),
      reactionImage:op.querySelector(".o-reaction").value.trim()
    }))
  }));
  return {eyebrow:$("eyebrow").value.trim(),title:$("title").value.trim(),subtitle:$("subtitle").value.trim(),questions};
}

async function loadQuiz(){
  if(!db)return;
  setSave("Memuat quiz...");
  try{
    const meta=await db.collection("quizSettings").doc("main").get();
    const snap=await db.collection("quizQuestions").orderBy("order").get();
    if(!meta.exists||snap.empty){renderEditor(defaultData());setSave("Belum ada quiz online. Ini template awal.");return;}
    const d=meta.data();
    renderEditor({eyebrow:d.eyebrow||"",title:d.title||"",subtitle:d.subtitle||"",questions:snap.docs.map(x=>x.data())});
    setSave("Quiz berhasil dimuat.");
  }catch(e){setSave("Gagal memuat quiz: "+e.message);}
}

async function saveQuiz(){
  if(!db)return;
  setSave("Menyimpan...");
  try{
    const data=collectEditor();
    await db.collection("quizSettings").doc("main").set({
      eyebrow:data.eyebrow,title:data.title,subtitle:data.subtitle,updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    const old=await db.collection("quizQuestions").get();
    const batch=db.batch();
    old.docs.forEach(d=>batch.delete(d.ref));
    data.questions.forEach((q,i)=>{
      const ref=db.collection("quizQuestions").doc("q"+(i+1));
      batch.set(ref,q);
    });
    await batch.commit();
    setSave("✅ Quiz tersimpan. Peserta sekarang akan mengambil versi terbaru.");
  }catch(e){setSave("❌ Gagal menyimpan: "+e.message);}
}

function setupTabs(){
  document.querySelectorAll("[data-tab]").forEach(btn=>btn.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    $("editorTab").classList.toggle("hidden",btn.dataset.tab!=="editor");
    $("resultsTab").classList.toggle("hidden",btn.dataset.tab!=="results");
    if(btn.dataset.tab==="results")loadResults();
  });
}

async function loadResults(){
  if(!db)return;
  $("rows").innerHTML='<tr><td colspan="5">Memuat...</td></tr>';
  try{
    const s=await db.collection("quizResults").orderBy("createdAt","desc").limit(500).get();
    cache=s.docs.map(d=>({id:d.id,...d.data()}));
    $("rows").innerHTML=cache.map(x=>`<tr><td>${esc(x.name)}</td><td>${Number(x.score)||0}</td><td>${Number(x.questionCount)||0}</td><td>${Math.floor((x.durationSeconds||0)/60)}:${String((x.durationSeconds||0)%60).padStart(2,"0")}</td><td>${x.createdAt?.toDate?x.createdAt.toDate().toLocaleString("id-ID"):"-"}</td></tr>`).join("")||'<tr><td colspan="5">Belum ada hasil.</td></tr>';
  }catch(e){$("rows").innerHTML='<tr><td colspan="5">Gagal memuat. Periksa Rules dan UID admin.</td></tr>';}
}
$("export").onclick=()=>{
  const rows=[["Nama","Skor","Jumlah soal","Durasi detik","Waktu kirim"],...cache.map(x=>[x.name,x.score,x.questionCount,x.durationSeconds,x.createdAt?.toDate?x.createdAt.toDate().toISOString():""])];
  const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));a.download="hasil-quiz-stive.csv";a.click();
};

$("loginBtn").onclick=async()=>{
  if(!auth){setMsg("Isi firebase-config.js dulu.");return}
  try{await auth.signInWithEmailAndPassword($("email").value,$("password").value);setMsg("");}
  catch(e){setMsg("Login gagal: "+e.message);}
};
$("logout").onclick=()=>auth.signOut();
$("saveQuiz").onclick=saveQuiz;
$("reloadQuiz").onclick=loadQuiz;
$("refresh").onclick=loadResults;
setupTabs();

try{
  if(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey&&window.FIREBASE_CONFIG.apiKey!=="ISI_API_KEY"){
    firebase.initializeApp(window.FIREBASE_CONFIG);
    auth=firebase.auth();db=firebase.firestore();
    auth.onAuthStateChanged(async u=>{
      if(u){$("login").classList.add("hidden");$("panel").classList.remove("hidden");$("who").textContent="Login: "+u.email;await loadQuiz();}
      else{$("login").classList.remove("hidden");$("panel").classList.add("hidden");}
    });
  }
}catch(e){setMsg("Konfigurasi Firebase belum benar: "+e.message);}
</script>
</body>
</html>
